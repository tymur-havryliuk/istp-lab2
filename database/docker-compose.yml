services:
  postgres:
    image: postgres:16
    container_name: maintenance_service_db
    environment:
      POSTGRES_DB: maintenance_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - maintenance_service_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

volumes:
  maintenance_service_pgdata:
